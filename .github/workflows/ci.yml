name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/test_nes_timing.py --cc cc
      - run: |
          cc -std=c99 -Wall -Wextra -Werror tools/tests/test_update_version.c -o /tmp/test-update-version
          /tmp/test-update-version
  build:
    needs: tests
    uses: ./.github/workflows/build-images.yml
    with:
      version: '0.0.0'
      targets: '["esp32-s3-n16r8-ili9341", "esp32-s3-n8r2-st7796"]'
