name: Build firmware images
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      targets:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    env:
      PROJECT_VER: ${{ inputs.version }}
      PROJECT_NAME: Retro-Go
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply ESP-IDF 5.5.5 P4 clock patch
        if: startsWith(matrix.target, 'esp32-p4-')
        shell: bash
        run: |
          set -euo pipefail
          test -f "$IDF_PATH/components/esp_hw_support/port/esp32p4/rtc_clk.c"
          cp esp-idf-patch/v5.5.5/rtc_clk.c "$IDF_PATH/components/esp_hw_support/port/esp32p4/rtc_clk.c"
      - name: Build complete image with factory updater
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          . "$IDF_PATH/export.sh"
          python rg_tool.py --target "$BUILD_TARGET" release
          python tools/release.py check "retro-go_${PROJECT_VER}_${BUILD_TARGET}.img" "$PROJECT_VER" "$BUILD_TARGET"
      - name: Upload validated image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: retro-go_${{ inputs.version }}_${{ matrix.target }}.img
          if-no-files-found: error
          retention-days: 14
