<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro-Go theme gallery</title><style>body{background:#10131b;color:#eef1fa;font:16px system-ui;margin:0;padding:clamp(20px,5vw,64px)}h1{font-size:clamp(28px,4vw,44px);margin-bottom:10px}p{color:#aeb9d1;max-width:70ch;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:32px}.card{cursor:pointer;text-align:left;background:#1a2030;color:inherit;border:1px solid #303c55;border-radius:14px;padding:14px;transition:transform .15s,border-color .15s}.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:#97b0ff}.card img{width:100%;aspect-ratio:4/3;object-fit:contain;image-rendering:pixelated;border-radius:6px}.card span{display:block;padding:13px 2px 2px;font-size:16px;font-weight:650}dialog{background:#151c2b;color:white;border:1px solid #7185ae;border-radius:14px;padding:22px;max-width:90vw}dialog::backdrop{background:#000b}dialog img{width:min(640px,80vw);image-rendering:pixelated}dialog button{float:right;cursor:pointer;background:#303e5c;color:white;border:0;padding:10px 16px;border-radius:8px}</style><h1>Retro-Go themes</h1><p>15 complete palettes. Every theme includes artwork for 23 tabs, including Game Boy Advance, Atari, Spectrum, Media Player and File Manager. Select a preview to inspect the colors. Existing system artwork is preserved except blank placeholders.</p><div class="grid"><button class="card" onclick="show(this)"><img src="Art%20Book%20Next/preview.png" alt="Art Book Next theme preview"><span>Art Book Next</span></button><button class="card" onclick="show(this)"><img src="base/preview.png" alt="base theme preview"><span>base</span></button><button class="card" onclick="show(this)"><img src="basic/preview.png" alt="basic theme preview"><span>basic</span></button><button class="card" onclick="show(this)"><img src="box/preview.png" alt="box theme preview"><span>box</span></button><button class="card" onclick="show(this)"><img src="classic/preview.png" alt="classic theme preview"><span>classic</span></button><button class="card" onclick="show(this)"><img src="clean/preview.png" alt="clean theme preview"><span>clean</span></button><button class="card" onclick="show(this)"><img src="comicbook/preview.png" alt="comicbook theme preview"><span>comicbook</span></button><button class="card" onclick="show(this)"><img src="Commic%20Book/preview.png" alt="Commic Book theme preview"><span>Commic Book</span></button><button class="card" onclick="show(this)"><img src="default/preview.png" alt="default theme preview"><span>default</span></button><button class="card" onclick="show(this)"><img src="GBZ/preview.png" alt="GBZ theme preview"><span>GBZ</span></button><button class="card" onclick="show(this)"><img src="noir/preview.png" alt="noir theme preview"><span>noir</span></button><button class="card" onclick="show(this)"><img src="pixel/preview.png" alt="pixel theme preview"><span>pixel</span></button><button class="card" onclick="show(this)"><img src="Super%20Lopez/preview.png" alt="Super Lopez theme preview"><span>Super Lopez</span></button><button class="card" onclick="show(this)"><img src="Superlopez/preview.png" alt="Superlopez theme preview"><span>Superlopez</span></button><button class="card" onclick="show(this)"><img src="tv/preview.png" alt="tv theme preview"><span>tv</span></button></div><dialog id="view"><button onclick="view.close()">Close</button><h2 id="name"></h2><img id="large" alt="Selected theme preview"></dialog><script>function show(card){document.getElementById('name').textContent=card.querySelector('span').textContent;document.getElementById('large').src=card.querySelector('img').src;document.getElementById('view').showModal()}document.getElementById('view').addEventListener('click',function(e){if(e.target===this)this.close()})</script></html>
