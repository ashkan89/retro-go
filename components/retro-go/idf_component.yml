dependencies:
  espressif/esp_wifi_remote:
    version: "1.3.1"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "2.13.1"
    rules:
      - if: "target == esp32p4"
  espressif/usb_host_hid:
    version: "^1.0.1"
    rules:
      - if: "target in [esp32s3, esp32p4]"
  espressif/esp_tinyusb:
    version: "^2.2.1"
    rules:
      - if: "target in [esp32s3, esp32p4]"
